name: M31 Halium Kernel CI (Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Dependencies
      # =========================
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev \
            python3 unzip zip \
            cpio lz4 git wget curl

      # =========================
      # STABLE CLANG (Neutron - CI safe)
      # =========================
      - name: Download Clang
        run: |
          git clone --depth=1 https://github.com/Neutron-Toolchains/clang-build.git clang

      # =========================
      # Build kernel
      # =========================
      - name: Build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          # toolchain
          export PATH=$PWD/clang/bin:$PATH
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1

          # IMPORTANT FIX (fixdep crash fix)
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++

          # prevent clang toolchain from hijacking host ld
          export HOSTLD=/usr/bin/ld

          make O=out exynos9611-m31_defconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=/usr/bin/gcc \
            HOSTCXX=/usr/bin/g++ \
            HOSTLD=/usr/bin/ld

      # =========================
      # Upload artifacts
      # =========================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: M31-kernel
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo*
            out/arch/arm64/boot/dts/**/*
